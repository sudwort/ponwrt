name: Build PonWrt (FiberHome HG5382A / HG5582A)

on:
  workflow_dispatch:      # 允许在网页手动点“Run workflow”触发
  # push:
  #   branches: [master] # 如需推送即编译，取消注释

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340   # 免费版 job 上限 6 小时，这里留安全余量

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync unzip zlib1g-dev file wget subversion ccache zstd xz-utils \
            device-tree-compiler libelf-dev qemu-utils mkisofs

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-an7581-${{ github.sha }}
          restore-keys: ccache-an7581-

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加入 NPU 状态界面包
        run: |
          git clone --depth 1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          # 该仓库根目录和同名子目录里各有一份 Makefile/htdocs/root/po，
          # 嵌套那份会让 OpenWrt 扫描时重复注册同一个包，必须删掉
          rm -rf package/luci-app-airoha-npu/luci-app-airoha-npu
          ls package/luci-app-airoha-npu

      - name: 生成配置
        run: |
          cp configs/an7581.config .config
          # 注意：不要单选型号！官方 config 启用哪些设备就按它的原样编。
          # 之前手动只留 hg5382a，破坏了设备符号联动（choice / image 布尔 / DEVICE_PACKAGES
          # 是三组不同符号），导致 PON 前端/驱动缺失，且事后补驱动也救不回来。
          # 开启 initramfs 恢复镜像（产物后缀 -recovery.itb）
          sed -i 's/.*CONFIG_TARGET_ROOTFS_INITRAMFS.*/CONFIG_TARGET_ROOTFS_INITRAMFS=y/' .config
          # 开启 NPU 流量统计（内核选项，默认关闭）
          echo 'CONFIG_KERNEL_NET_AIROHA_FLOW_STATS=y' >> .config
          # NPU 状态界面包
          echo 'CONFIG_PACKAGE_luci-app-airoha-npu=y' >> .config
          # 界面包需要的：debugfs（PPE 流表）、devmem（Frame Engine 寄存器与超频）
          echo 'CONFIG_KERNEL_DEBUG_FS=y' >> .config
          echo 'CONFIG_BUSYBOX_CONFIG_DEVMEM=y' >> .config
          # 开启 ccache（官方 config 默认关闭，不开每次从零编译约 100 分钟）
          sed -i 's|^# CONFIG_CCACHE is not set$|CONFIG_CCACHE=y|' .config
          sed -i 's|^CONFIG_CCACHE_DIR=.*$|CONFIG_CCACHE_DIR="/home/runner/.ccache"|' .config
          make defconfig
          echo '--- 关键配置硬校验：缺任何一条直接失败，不带病编两小时 ---'
          grep -q '^CONFIG_PACKAGE_luci-app-airoha-npu=y$' .config || { echo '::error::luci-app-airoha-npu 没被 .config 接受，界面包注册失败'; exit 1; }
          grep -q '^CONFIG_KERNEL_NET_AIROHA_FLOW_STATS=y$' .config || { echo '::error::NET_AIROHA_FLOW_STATS 没生效'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_FS=y$' .config || { echo '::error::DEBUG_FS 没生效'; exit 1; }
          grep -q '^CONFIG_BUSYBOX_CONFIG_DEVMEM=y$' .config || { echo '::error::devmem 没生效'; exit 1; }
          grep -q '^CONFIG_CCACHE=y$' .config || { echo '::error::ccache 没启用'; exit 1; }
          grep -E '^CONFIG_PACKAGE_luci-app-airoha-npu=y$|^CONFIG_KERNEL_NET_AIROHA_FLOW_STATS=y$|^CONFIG_KERNEL_DEBUG_FS=y$|^CONFIG_BUSYBOX_CONFIG_DEVMEM=y$|^CONFIG_CCACHE=y$' .config
          echo '--- 将编译的设备 ---'
          grep -E '^CONFIG_TARGET_DEVICE_.*_DEVICE_.*=y' .config

      - name: 确认自定义配置已就位
        run: |
          echo '--- 源码树根 files/ 下的文件（会被打进固件根文件系统）---'
          find files -type f 2>/dev/null | sed 's/^/  /' || echo '  （无 files/ 目录，固件用默认网络配置）'

      - name: 编译
        run: |
          export CCACHE_DIR=~/.ccache
          export CCACHE_MAXSIZE=5G
          ccache -z                      # 清零统计，方便看本次实际命中率
          make -j$(nproc) 2>&1 | tail -n 2000
          echo '--- 本次 ccache 命中情况 ---'
          ccache -s || true

      - name: 收集产物
        run: |
          mkdir -p artifacts
          # 现在会编出全部设备的镜像，只挑 hg5382a 的进产物（不然产物几百 MB）
          find bin/targets/airoha/an7581 -type f -name '*fiberhome_hg5382a*' \
            \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.tar' \) \
            -exec cp {} artifacts/ \;
          # 带上完整包清单 + 界面包 ipk，方便直接核对 NPU 界面到底编进去没有
          cp bin/targets/airoha/an7581/packages.manifest artifacts/ 2>/dev/null || true
          find bin -name 'luci-app-airoha-npu*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-hg5382a
          path: artifacts/
          retention-days: 30
